### model
model_name_or_path: /home/ljl/Data/LLM/GLM-4-9B-0414
trust_remote_code: True
reward_model_type: api
reward_model: http://127.0.0.1:38294/reward

### method
stage: ppo
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1

### dataset
dataset_dir: data
template: glm4
dataset: train_ppo
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true

### output
output_dir: saves/train_ppo
logging_steps: 1
save_steps: 150
plot_loss: true
overwrite_output_dir: true

### train
preprocessing_num_workers: 16
per_device_train_batch_size: 5
ppo_buffer_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.e-5
num_train_epochs: 1.0
ppo_target: 6.0
ppo_score_norm: True
ppo_whiten_rewards: True
lr_scheduler_type: cosine
optim: adamw_torch
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
flash_attn: auto

### generate
max_new_tokens: 512
top_p: 0.9
temperature: 0.8
repetition_penalty: 1.2
