### model
model_name_or_path: ~
trust_remote_code: True
adapter_name_or_path: ~

### method
stage: dpo
do_train: true
finetuning_type: lora
# lora_target: q_proj,k_proj,v_proj,o_proj
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

# DPO 关键参数
pref_ftx: 0.0
pref_beta: 0.1
pref_loss: sigmoid  # choices: [sigmoid (dpo), orpo, simpo]

### dataset
dataset_dir: data
dataset: train_dpo
template: glm4
cutoff_len: 4096
max_samples: 100000
overwrite_cache: true

### output
output_dir: saves/dpo
logging_steps: 5
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### train
preprocessing_num_workers: 16
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 1.e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
optim: adamw_torch
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
flash_attn: auto
max_grad_norm: 0.8
upcast_layernorm: true
packing: False
report_to: none

### eval
eval_dataset: dev_dpo
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 50